# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users: IDE settings override this file.
# https://docs.gradle.org/current/userguide/build_environment.html

# This machine is ~8GB RAM. Keep Gradle+Kotlin under ~3.5GB total or the OS swaps
# and builds stretch to 30–60+ min. Do NOT set -Xmx6g on 8GB Macs.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1536m
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Cap parallel workers so clang/Kotlin/Metro don't thrash memory together.
org.gradle.workers.max=2

android.useAndroidX=true
# RN 0.85+ is already AndroidX; jetifier OOMs on react-android AAR and is not needed.
android.enableJetifier=false

newArchEnabled=true
hermesEnabled=true

# Build only device ABI by default (biggest cold-build win).
# Emulator:  ./gradlew assembleDebug -PreactNativeArchitectures=x86_64
# All ABIs:  ./gradlew assembleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64
reactNativeArchitectures=arm64-v8a

# Enable only while debugging native/CMake failures (adds I/O overhead).
# android.native.buildOutput=verbose

MYAPP_RELEASE_STORE_FILE=consultancy.jks
MYAPP_RELEASE_KEY_ALIAS=key0
MYAPP_RELEASE_STORE_PASSWORD=123456
MYAPP_RELEASE_KEY_PASSWORD=123456

# edgeToEdgeEnabled=false
